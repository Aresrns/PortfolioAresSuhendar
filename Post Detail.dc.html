<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
<title>Tulisan — Ares Suhendar</title>
<meta name="description" content="Catatan praktik Product Owner: audit produk, prioritisasi backlog, dan discovery yang menghasilkan issue siap kerja." />
<meta name="author" content="Ares Suhendar" />
<meta name="theme-color" content="#04101a" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Ares Suhendar" />
<meta property="og:title" content="Tulisan — Ares Suhendar" />
<meta property="og:description" content="Catatan praktik Product Owner: audit produk, prioritisasi backlog, dan discovery yang menghasilkan issue siap kerja." />
<meta property="og:image" content="assets/share-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tulisan — Ares Suhendar" />
<meta name="twitter:description" content="Catatan praktik Product Owner: audit produk, prioritisasi backlog, dan discovery yang menghasilkan issue siap kerja." />
<meta name="twitter:image" content="assets/share-card.png" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #04101a; }
  * { box-sizing: border-box; }
  a { color: #22d3ee; text-decoration: none; }
  a:hover { opacity: 0.82; }
  @keyframes artReveal { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes artDrift { 0%, 100% { transform: scale(1) translate3d(0, 0, 0); } 50% { transform: scale(1.035) translate3d(0, -6px, 0); } }
  @keyframes artSheen { 0% { transform: translateX(-130%) skewX(-18deg); } 55%, 100% { transform: translateX(230%) skewX(-18deg); } }
  @media (prefers-reduced-motion: reduce) { [data-anim] { animation: none !important; } }
  image-slot::part(frame) { background: transparent; }
  image-slot::part(ring) { display: none; }
</style>
</helmet>
<div style="{{ rootStyle }}" hint-placeholder-val="{{ true }}">
<div style="background: var(--page, #04101a); color: var(--body, #93a8b6); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; line-height: 1.5; min-height: 100vh;">

  <div style="position: sticky; top: 0; z-index: 20; background: var(--nav, rgba(4,16,26,0.82)); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line, rgba(34,211,238,0.12));">
    <div style="max-width: 760px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px;">
      <a href="Portfolio Ares Suhendar.dc.html" style="display: inline-flex; align-items: center; gap: 7px; color: var(--strong, #dceaf1); font-size: 12.5px; white-space: nowrap;">
        <span style="flex: none; width: 14px; height: 14px; display: block; background: currentColor; -webkit-mask: url(https://unpkg.com/lucide-static@0.469.0/icons/arrow-left.svg) center / contain no-repeat; mask: url(https://unpkg.com/lucide-static@0.469.0/icons/arrow-left.svg) center / contain no-repeat;"></span>{{ ui.back }}
      </a>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; padding: 2px; border-radius: 999px; border: 1px solid var(--line, rgba(255,255,255,0.12)); background: var(--surface2, rgba(255,255,255,0.03));">
          <button onClick="{{ setId }}" style="{{ idBtnStyle }}">ID</button>
          <button onClick="{{ setEn }}" style="{{ enBtnStyle }}">EN</button>
        </div>
        <button onClick="{{ toggleTheme }}" style="width: 30px; height: 30px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line, rgba(255,255,255,0.12)); background: var(--surface2, rgba(255,255,255,0.03)); color: var(--accent, #22d3ee); font-size: 13px; display: flex; align-items: center; justify-content: center;">{{ themeIcon }}</button>
      </div>
    </div>
  </div>

  <div style="max-width: 760px; margin: 0 auto; padding: 26px 20px 48px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: var(--muted, #6d8797);">
        <span style="padding: 3px 8px; border-radius: 5px; white-space: nowrap; background: var(--accentSoft, rgba(34,211,238,0.1)); color: var(--accent, #7fdbe8);">{{ p.tag }}</span>
        <span style="white-space: nowrap;">{{ p.date }}</span>
        <span style="white-space: nowrap;">{{ p.read }}</span>
      </div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(27px, 4.2vw, 38px); font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; color: var(--ink, #f2f8fb); text-wrap: pretty;">{{ p.title }}</h1>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--strong, #dceaf1); text-wrap: pretty;">{{ p.excerpt }}</p>
    </div>

    <div data-anim="reveal" style="position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line, rgba(255,255,255,0.08)); background: var(--surface2, #071824); animation: artReveal 0.7s cubic-bezier(0.22, 0.8, 0.3, 1) both;">
      <image-slot data-anim="drift" id="{{ p.slotId }}" src="{{ p.img }}" shape="rect" fit="contain" placeholder="taruh foto di sini" style="position: absolute; top: 16px; left: 16px; width: calc(100% - 32px); height: calc(100% - 32px); display: block; animation: artDrift 20s ease-in-out infinite;"></image-slot>
      <div data-anim="sheen" style="position: absolute; top: -20%; left: 0; width: 34%; height: 140%; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent); animation: artSheen 9s ease-in-out infinite 1.2s;"></div>
      <div style="position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 60px -22px var(--glow, rgba(34,211,238,0.22));"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <sc-for list="{{ p.body }}" as="para" hint-placeholder-count="3">
        <p style="margin: 0; font-size: 14px; line-height: 1.8; color: var(--body, #93a8b6); text-wrap: pretty;">{{ para }}</p>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: {{ cols }}; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line, rgba(255,255,255,0.07));">
      <sc-for list="{{ others }}" as="o" hint-placeholder-count="2">
        <a href="{{ o.href }}" style="border-radius: 12px; border: 1px solid var(--line, rgba(255,255,255,0.07)); background: var(--surface2, rgba(5,18,28,0.8)); padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; color: inherit; transition: border-color 0.25s ease, transform 0.25s ease;" style-hover="border-color: var(--accentBd, rgba(34,211,238,0.45)); transform: translateY(-2px);">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--muted, #6d8797);">{{ o.date }}</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; line-height: 1.25; color: var(--ink, #eef6fa);">{{ o.title }}</span>
        </a>
      </sc-for>
    </div>

  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const THEMES = {
  dark: {
    '--page': 'radial-gradient(900px 500px at 78% -6%, rgba(34,211,238,0.16), transparent 60%), #04101a',
    '--nav': 'rgba(4,16,26,0.82)',
    '--surface': 'rgba(8,23,34,0.78)',
    '--surface2': 'rgba(5,18,28,0.8)',
    '--line': 'rgba(255,255,255,0.08)',
    '--ink': '#f2f8fb',
    '--strong': '#dceaf1',
    '--body': '#93a8b6',
    '--muted': '#8ba2b1',
    '--accent': '#22d3ee',
    '--accentSoft': 'rgba(34,211,238,0.1)',
    '--accentBd': 'rgba(34,211,238,0.3)',
    '--glow': 'rgba(34,211,238,0.22)',
    '--btnBg': 'linear-gradient(100deg, #22d3ee, #0ea5b7)',
    '--btnInk': '#04101a'
  },
  light: {
    '--page': 'radial-gradient(900px 500px at 78% -6%, rgba(14,165,183,0.12), transparent 60%), #f2f6f8',
    '--nav': 'rgba(242,246,248,0.85)',
    '--surface': '#ffffff',
    '--surface2': '#f5f9fb',
    '--line': 'rgba(6,32,44,0.12)',
    '--ink': '#062330',
    '--strong': '#12384a',
    '--body': '#4a6272',
    '--muted': '#5c7484',
    '--accent': '#0b7f92',
    '--accentSoft': 'rgba(11,127,146,0.09)',
    '--accentBd': 'rgba(11,127,146,0.28)',
    '--glow': 'rgba(11,127,146,0.16)',
    '--btnBg': 'linear-gradient(100deg, #0e93a8, #0b6f80)',
    '--btnInk': '#ffffff'
  }
};

const IMGS = [
  'assets/blog-audit.png', 'assets/blog-priority.png', 'assets/blog-roadmap.png',
  'assets/blog-stakeholder.png', 'assets/blog-spec.png', 'assets/blog-metrics.png',
  'assets/blog-eight.png', 'assets/blog-migration.png', 'assets/blog-pricing.png'
];

class Component extends DCLogic {
  state = { theme: 'dark', lang: 'id', data: null, ui: null, index: 0, bp: 'lg' };

  componentDidMount() {
    const q = new URLSearchParams(location.search);
    const n = parseInt(q.get('a') || '1', 10);
    let lang = q.get('lang');
    let theme = null;
    try {
      theme = localStorage.getItem('ares-theme');
      if (!lang) lang = localStorage.getItem('ares-lang');
    } catch (e) {}
    const next = { index: isNaN(n) ? 0 : Math.max(0, Math.min(8, n - 1)) };
    if (lang === 'id' || lang === 'en') next.lang = lang;
    if (theme === 'dark' || theme === 'light') next.theme = theme;
    this.setState(next);
    import('./posts-data.js').then((m) => this.setState({ data: m.POSTS, ui: m.PUI }));
    this.measure();
    this.onResize = () => this.measure();
    window.addEventListener('resize', this.onResize);
  }

  componentWillUnmount() {
    if (this.onResize) window.removeEventListener('resize', this.onResize);
    clearTimeout(this.chromeTimer);
  }

  // Slot frame/ring are hidden by image-slot::part() rules in the helmet.

  componentDidUpdate() {
    const t = this.state.data && this.state.data[this.state.lang][this.state.index];
    if (t) document.title = t[0] + ' — Ares Suhendar';
  }

  measure() {
    const bp = window.innerWidth < 700 ? 'sm' : 'lg';
    if (bp !== this.state.bp) this.setState({ bp: bp });
  }

  set(key, val) {
    this.setState({ [key]: val });
    try { localStorage.setItem(key === 'theme' ? 'ares-theme' : 'ares-lang', val); } catch (e) {}
  }

  renderVals() {
    const lang = this.state.lang;
    const dark = this.state.theme === 'dark';
    const i = this.state.index;
    const langBtn = (on) => ({
      padding: '3px 9px', borderRadius: '999px', border: 'none', cursor: 'pointer',
      fontFamily: "'JetBrains Mono', monospace", fontSize: '10.5px', letterSpacing: '0.04em',
      background: on ? 'var(--btnBg)' : 'transparent',
      color: on ? 'var(--btnInk)' : 'var(--muted)'
    });
    const base = {
      rootStyle: THEMES[this.state.theme],
      themeIcon: dark ? '\u2600' : '\u263e',
      toggleTheme: () => this.set('theme', dark ? 'light' : 'dark'),
      setId: () => this.set('lang', 'id'),
      setEn: () => this.set('lang', 'en'),
      idBtnStyle: langBtn(lang === 'id'),
      enBtnStyle: langBtn(lang === 'en'),
      cols: this.state.bp === 'sm' ? '1fr' : 'repeat(2, minmax(0, 1fr))'
    };
    const d = this.state.data;
    const u = this.state.ui;
    if (!d || !u) {
      return Object.assign(base, {
        ui: { back: '', crumb: '' },
        p: { title: '', date: '', read: '', tag: '', excerpt: '', body: [], img: IMGS[i], slotId: 'ares-post-' + (i + 1) },
        others: []
      });
    }
    const L = d[lang];
    const r = L[i] || [];
    return Object.assign(base, {
      ui: u[lang],
      p: { title: r[0], date: r[1], read: r[2], excerpt: r[3], tag: r[4], body: r[5] || [], img: IMGS[i], slotId: 'ares-post-' + (i + 1) },
      others: L
        .map((x, k) => ({ title: x[0], date: x[1], href: 'Post Detail.dc.html?a=' + (k + 1) + '&lang=' + lang, k: k }))
        .filter((o) => o.k !== i)
        .slice(0, 2)
    });
  }
}
</script>
</body>
</html>
